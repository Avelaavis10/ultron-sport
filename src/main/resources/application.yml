spring:
  application:
    name: ultron-sport-backend
  datasource:
    url: jdbc:h2:mem:ultronsport;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: ${ULTRON_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${ULTRON_MULTIPART_MAX_REQUEST_SIZE:50MB}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    issuer: ultron-sport-local
    # Local-development secret only. Override with ULTRON_JWT_SECRET in deployed environments.
    secret: ${ULTRON_JWT_SECRET:local-dev-secret-change-before-production-32chars}
    expiration-minutes: ${ULTRON_JWT_EXPIRATION_MINUTES:60}

storage:
  mode: ${ULTRON_STORAGE_MODE:LOCAL}
  public-base-url: ${ULTRON_STORAGE_PUBLIC_BASE_URL:http://localhost:8080/media}
  max-file-size-bytes: ${ULTRON_STORAGE_MAX_FILE_SIZE_BYTES:52428800}
  local:
    base-path: ${ULTRON_STORAGE_LOCAL_BASE_PATH:./uploads/ultron-sport}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ultron_sport}
    username: ${DATABASE_USERNAME:ultron}
    password: ${DATABASE_PASSWORD:ultron}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
